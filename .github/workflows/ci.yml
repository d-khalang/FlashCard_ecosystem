name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashcard-project
    env:
      BOT_TOKEN: 123456:test-bot-token
      LOGGER_BOT_TOKEN: 123456:test-logger-bot-token
      ADMIN_ID: "1"
      TELEGRAM_DELIVERY_MODE: webhook
      WEBHOOK_BASE: https://bot.example.com
      WEBHOOK_PATH: /webhook/telegram/test
      WEBHOOK_SECRET: test-secret
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: flashcard_db
      COLLECTION_USERS: users
      COLLECTION_EXPRESSION: expressions
      COLLECTION_CONJUGATION: conjugations
      PORT: "8000"
      IN_DOCKER: "0"
      SCRAPER_API_KEY: test-scraper-key
      SCRAPER_URL: http://localhost
      SCRAPER_PORT: "8000"
      LOG_LEVEL: INFO
      SCHEDULER_CHECK_INTERVAL_SECONDS: "600"
      LLM_API_KEY: test-llm-key
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: flashcard-project/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -q --tb=short

      - name: Run integration and smoke tests
        run: pytest tests/integration tests/smoke -q --tb=short

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Checkout conjugator submodule
        run: git submodule update --init --depth 1 it-conjugator-api

      - name: Build flashcard-bot image
        run: docker build -t flashcard-bot-ci ./flashcard-project

      - name: Build conjugator image
        run: docker build -t conjugator-ci ./it-conjugator-api
