name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The release workflow calls this one, so a release passes exactly the same checks as CI.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel a superseded run on a pull request, never on main: every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # ruff: pyflakes and bugbear rules only (see [tool.ruff] in flashcard-project/pyproject.toml).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flashcard-project
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: flashcard-project/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Run ruff
        run: ruff check src tests dev

  types:
    # mypy over src/. Modules with known errors are listed in [tool.mypy] as a baseline; the rest,
    # and every new module, must pass.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flashcard-project
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: flashcard-project/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Run mypy
        run: mypy

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashcard-project
    env:
      BOT_TOKEN: 123456:test-bot-token
      LOGGER_BOT_TOKEN: 123456:test-logger-bot-token
      ADMIN_ID: "1"
      TELEGRAM_DELIVERY_MODE: webhook
      WEBHOOK_BASE: https://bot.example.com
      WEBHOOK_PATH: /webhook/telegram/test
      WEBHOOK_SECRET: test-secret
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: flashcard_db
      COLLECTION_USERS: users
      COLLECTION_EXPRESSION: expressions
      COLLECTION_CONJUGATION: conjugations
      PORT: "8000"
      IN_DOCKER: "0"
      SCRAPER_API_KEY: test-scraper-key
      SCRAPER_URL: http://localhost
      SCRAPER_PORT: "8000"
      LOG_LEVEL: INFO
      SCHEDULER_CHECK_INTERVAL_SECONDS: "600"
      LLM_API_KEY: test-llm-key
      KARTINO_TEST_MONGO_URI: mongodb://localhost:27017
      # Fail, never skip, when the Mongo service is missing.
      KARTINO_REQUIRE_MONGO: "1"
    services:
      mongo:
        # Not 8.0 (production's version): GitHub runners run Linux 6.19+, where MongoDB 8 refuses to
        # start (SERVER-121912). Return to 8.x once a release starts on these runners.
        image: mongo:7.0@sha256:9896df581dfd0718b7abe112f4c37598d0986c54060e4ec1384997e6503c8c71  # tag mongo:7.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: flashcard-project/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Run unit tests
        run: pytest tests/unit -q --tb=short

      - name: Run integration and smoke tests
        run: pytest tests/integration tests/smoke -q --tb=short

  miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  browser-tests:
    # The built Mini App on an iPhone (WebKit) and an Android phone (Chromium), against the real API,
    # a test MongoDB and fakes for Telegram, the LLM and speech. See tests/browser/conftest.py.
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: 123456:test-bot-token
      LOGGER_BOT_TOKEN: 123456:test-logger-bot-token
      ADMIN_ID: "1"
      TELEGRAM_DELIVERY_MODE: webhook
      WEBHOOK_BASE: https://bot.example.com
      WEBHOOK_PATH: /webhook/telegram/test
      WEBHOOK_SECRET: test-secret
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: flashcard_db
      COLLECTION_USERS: users
      COLLECTION_EXPRESSION: expressions
      COLLECTION_CONJUGATION: conjugations
      PORT: "8000"
      IN_DOCKER: "0"
      SCRAPER_API_KEY: test-scraper-key
      SCRAPER_URL: http://localhost
      SCRAPER_PORT: "8000"
      LOG_LEVEL: INFO
      SCHEDULER_CHECK_INTERVAL_SECONDS: "600"
      LLM_API_KEY: test-llm-key
      KARTINO_TEST_MONGO_URI: mongodb://localhost:27017
      # Fail, never skip, when the Mongo service, the build or a browser is missing.
      KARTINO_REQUIRE_MONGO: "1"
      KARTINO_REQUIRE_BROWSER: "1"
    services:
      mongo:
        image: mongo:7.0@sha256:9896df581dfd0718b7abe112f4c37598d0986c54060e4ec1384997e6503c8c71  # see unit-tests
        ports:
          - 27017:27017
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Build the Mini App
        working-directory: miniapp
        env:
          VITE_DEV_INIT_DATA: ""
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: flashcard-project/requirements-dev.txt

      - name: Install dependencies and browsers
        working-directory: flashcard-project
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
          python -m playwright install --with-deps webkit chromium

      - name: Run browser tests
        working-directory: flashcard-project
        run: pytest tests/browser -q --tb=short

      - name: Upload screenshots and traces of failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-failures
          path: flashcard-project/tests/browser/.artifacts/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    # Known vulnerabilities in the locked Python packages and the production npm packages.
    # pip-audit fails on any finding (it has no severity filter); npm audit fails on high and above.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check the lock files match pyproject.toml
        working-directory: flashcard-project
        # Resolves again, keeping the locked versions: only an edit of pyproject.toml changes the result.
        run: |
          pip install uv==0.13.8
          uv pip compile pyproject.toml --universal --python-version 3.12 --generate-hashes -o requirements.txt
          uv pip compile pyproject.toml --extra dev --universal --python-version 3.12 --generate-hashes -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt

      - name: Audit Python dependencies
        working-directory: flashcard-project
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --no-deps --disable-pip

      - name: Audit Mini App production dependencies
        working-directory: miniapp
        run: npm audit --omit=dev --audit-level=high

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Checkout conjugator submodule
        run: git submodule update --init --depth 1 it-conjugator-api

      - name: Build flashcard-bot image
        run: docker build -t flashcard-bot-ci ./flashcard-project

      - name: Build conjugator image
        run: docker build -t conjugator-ci ./it-conjugator-api

      - name: Build Mini App image
        run: docker build -f miniapp/Dockerfile -t flashcard-miniapp-ci .
