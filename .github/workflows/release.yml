name: Publish Release Images

on:
  release:
    types:
      - published
  # Promote an already published final release again (e.g. after a failed run), with this workflow
  # from main. Final releases only: a candidate is built only when it is published.
  workflow_dispatch:
    inputs:
      tag:
        description: Final release tag to promote (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

# Release candidates (vX.Y.Z-rc.N, published as pre-releases) are built once, after all CI checks.
# A final release (vX.Y.Z) builds nothing: it must point at the commit of a verified release candidate
# and re-tags that candidate's images, so production gets the exact bytes that were checked.
jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.check.outputs.kind }}
      base: ${{ steps.check.outputs.base }}
      rc_tag: ${{ steps.check.outputs.rc_tag }}
    defaults:
      run:
        working-directory: flashcard-project
    steps:
      - name: Checkout release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate release version
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit 1; }
          tag_sha="$(git rev-parse HEAD)"  # the checkout is the tag
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            PRERELEASE="$(gh release view "$TAG" -R "$REPO" --json isPrerelease --jq .isPrerelease)"
            [[ "$TAG" != *-rc.* ]] || fail "Only a final release can be promoted by hand; publish a candidate to build it"
          fi
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.([0-9]+))?$ ]] || fail "Release tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N"
          base="${BASH_REMATCH[1]}"
          rc_number="${BASH_REMATCH[3]}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          # The tagged commit carries the final version (older candidates carried their -rc.N suffix).
          [[ "${package_version%%-rc.*}" == "$base" ]] || fail "Release tag $TAG does not match package version $package_version"
          if [[ -n "$rc_number" ]]; then
            [[ "$PRERELEASE" == "true" ]] || fail "Publish $TAG as a pre-release"
            echo "kind=rc" >> "$GITHUB_OUTPUT"
          else
            [[ "$PRERELEASE" != "true" ]] || fail "A final release ($TAG) must not be a pre-release"
            # The verified candidate: the highest vX.Y.Z-rc.N whose commit is this one.
            rc_tag=""
            best=-1
            while IFS=$'\t' read -r ref type sha; do
              [[ -n "$ref" ]] || continue
              if [[ "$type" == "tag" ]]; then
                sha="$(gh api "repos/$REPO/git/tags/$sha" --jq .object.sha)"
              fi
              name="${ref#refs/tags/}"
              number="${name##*-rc.}"
              if [[ "$sha" == "$tag_sha" && "$number" =~ ^[0-9]+$ ]] && (( number > best )); then
                best="$number"
                rc_tag="$name"
              fi
            done < <(gh api "repos/$REPO/git/matching-refs/tags/v$base-rc." --jq '.[] | [.ref, .object.type, .object.sha] | @tsv')
            [[ -n "$rc_tag" ]] || fail "No release candidate of v$base is on commit $tag_sha: tag the commit of the verified candidate"
            [[ "$(gh release view "$rc_tag" -R "$REPO" --json isPrerelease --jq .isPrerelease)" == "true" ]] ||
              fail "$rc_tag has no pre-release"
            echo "kind=final" >> "$GITHUB_OUTPUT"
            echo "rc_tag=$rc_tag" >> "$GITHUB_OUTPUT"
            echo "Promoting $rc_tag to $TAG" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

  # The same checks as CI (Python with Mongo, Mini App tests and build, image builds), on the tagged commit.
  verify:
    name: Verify release
    needs: version
    if: needs.version.outputs.kind == 'rc'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish ${{ matrix.image }}
    needs: [version, verify]
    if: needs.version.outputs.kind == 'rc'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flashcard-bot
            context: ./flashcard-project
            dockerfile: ./flashcard-project/Dockerfile
            submodule: false
          - image: it-conjugator
            context: ./it-conjugator-api
            dockerfile: ./it-conjugator-api/Dockerfile
            submodule: true
          - image: flashcard-miniapp
            context: .
            dockerfile: ./miniapp/Dockerfile
            submodule: false
    steps:
      - name: Checkout release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Checkout conjugator submodule
        if: matrix.submodule
        run: git submodule update --init --depth 1 it-conjugator-api

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
          # The version inside the image is the final one: a verified candidate becomes the release as is.
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.base }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record immutable digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          digest_file="${{ matrix.image }}-digest.txt"
          printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" > "$digest_file"
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "\`$IMAGE@$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$RELEASE_TAG" "$digest_file" --clobber

  promote:
    name: Promote ${{ needs.version.outputs.rc_tag }}
    needs: version
    if: needs.version.outputs.kind == 'final'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag the release candidate's images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RC_TAG: ${{ needs.version.outputs.rc_tag }}
          BASE: ${{ needs.version.outputs.base }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate
          gh release download "$RC_TAG" -R "$REPO" -D candidate -p '*-digest.txt'
          for image in flashcard-bot it-conjugator flashcard-miniapp; do
            digest_file="$image-digest.txt"
            [[ -s "candidate/$digest_file" ]] || { echo "$RC_TAG has no $digest_file" >&2; exit 1; }
            reference="$(tr -d '[:space:]' < "candidate/$digest_file")"
            repository="${reference%@*}"
            digest="${reference#*@}"
            [[ "$repository" == "$REGISTRY/$OWNER/$image" && "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
              { echo "Unexpected reference in $RC_TAG's $digest_file: $reference" >&2; exit 1; }
            docker buildx imagetools create --tag "$repository:$BASE" "$reference"
            # The new tag must name the very same image (a copy with another digest is refused).
            tagged="sha256:$(docker buildx imagetools inspect --raw "$repository:$BASE" | sha256sum | cut -d' ' -f1)"
            [[ "$tagged" == "$digest" ]] || { echo "$repository:$BASE is $tagged, expected $digest" >&2; exit 1; }
            cp "candidate/$digest_file" "$digest_file"
            gh release upload "$RELEASE_TAG" "$digest_file" -R "$REPO" --clobber
            {
              echo "### $image"
              echo
              echo "\`$reference\` (from $RC_TAG)"
            } >> "$GITHUB_STEP_SUMMARY"
          done
