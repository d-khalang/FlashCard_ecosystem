name: Publish Release Images

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flashcard-project
    env:
      BOT_TOKEN: 123456:test-bot-token
      LOGGER_BOT_TOKEN: 123456:test-logger-bot-token
      ADMIN_ID: "1"
      TELEGRAM_DELIVERY_MODE: webhook
      WEBHOOK_BASE: https://bot.example.com
      WEBHOOK_PATH: /webhook/telegram/test
      WEBHOOK_SECRET: test-secret
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: flashcard_db
      COLLECTION_USERS: users
      COLLECTION_EXPRESSION: expressions
      COLLECTION_CONJUGATION: conjugations
      PORT: "8000"
      IN_DOCKER: "0"
      SCRAPER_API_KEY: test-scraper-key
      SCRAPER_URL: http://localhost
      SCRAPER_PORT: "8000"
      LOG_LEVEL: INFO
      SCHEDULER_CHECK_INTERVAL_SECONDS: "600"
    steps:
      - name: Checkout release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flashcard-project/pyproject.toml

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run complete test suite
        run: pytest tests -q --tb=short

  publish:
    name: Publish ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flashcard-bot
            context: ./flashcard-project
            dockerfile: ./flashcard-project/Dockerfile
            submodule: false
          - image: it-conjugator
            context: ./it-conjugator-api
            dockerfile: ./it-conjugator-api/Dockerfile
            submodule: true
    steps:
      - name: Checkout release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Checkout conjugator submodule
        if: matrix.submodule
        run: git submodule update --init --depth 1 it-conjugator-api

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record immutable digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          digest_file="${{ matrix.image }}-digest.txt"
          printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" > "$digest_file"
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "\`$IMAGE@$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$RELEASE_TAG" "$digest_file" --clobber
