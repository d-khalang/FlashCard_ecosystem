[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kartino"
version = "2.3.1"
authors = [
  { name="Kartino Team" },
]
description = "Kartino core services"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "aiogram>=3.3.0",
    "pymongo>=4.6.1",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    # Capped: tests mock the providers, so a new major version needs one real generation first.
    "google-genai>=1.10,<2",
    "groq>=0.31,<2",
    # The service refuses old clients with a 403 (7.2.8 on 2026-11-05), so images must be rebuilt in time.
    "edge-tts>=7.3.1,<8",
]

[project.scripts]
flashcard-bot = "flashcard.__main__:main"
flashcard-bot-dev = "flashcard.__main__:dev"
flashcard-bot-poll = "flashcard.__main__:main_poll"
flashcard-bot-dev-poll = "flashcard.__main__:dev_poll"
flashcard-miniapp = "flashcard.miniapp.api:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "commitizen>=3.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashcard = ["resources/*.json", "resources/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version"
]
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
major_version_zero = true

