[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kartino"
version = "2.4.1"
authors = [
  { name="Kartino Team" },
]
description = "Kartino core services"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "aiogram>=3.3.0",
    "pymongo>=4.6.1",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    # Capped: tests mock the providers, so a new major version needs one real generation first.
    "google-genai>=1.10,<4",
    "groq>=0.31,<2",
    # The service refuses old clients with a 403 (7.2.8 on 2026-11-05), so images must be rebuilt in time.
    "edge-tts>=7.3.1,<8",
]

[project.scripts]
flashcard-bot = "flashcard.__main__:main"
flashcard-bot-dev = "flashcard.__main__:dev"
flashcard-bot-poll = "flashcard.__main__:main_poll"
flashcard-bot-dev-poll = "flashcard.__main__:dev_poll"
flashcard-miniapp = "flashcard.miniapp.api:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    # Browser tests (tests/browser). Pinned: CI installs the browser builds of exactly this version.
    "playwright==1.65.0",
    "commitizen>=3.12.0",
    # Static checks (CI jobs `lint` and `types`). Pinned so a new release cannot turn CI red by itself.
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashcard = ["resources/*.json", "resources/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version"
]
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
major_version_zero = true


[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/browser/.artifacts"]

[tool.ruff.lint]
# Small on purpose: real bugs (pyflakes, bugbear), not style. Style rules would need a mass reformat.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E402",  # imports after sys.path/env setup are deliberate
    "E731",
    "B008",
    "B010",
    "B904",  # `from err` would change the exception chain; not a safe mechanical fix
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported and then named as test arguments.
"tests/**" = ["F811", "E741"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true

# Baseline: these modules have type errors today (208 errors in 33 of 120 files, 2026-11-13) and are
# not checked yet. Every other module is checked, and so is every new one. When you fix a module,
# remove it from this list. Never add a module here to get a new error through.
[[tool.mypy.overrides]]
module = [
    "flashcard.app.review",
    "flashcard.app.settings",
    "flashcard.app.study",
    "flashcard.migrations.convert_dates",
    "flashcard.migrations.dedupe_expressions",
    "flashcard.miniapp.rate_limit",
    "flashcard.scheduler.scheduler",
    "flashcard.schemas.conjugations",
    "flashcard.schemas.expression",
    "flashcard.schemas.languages",
    "flashcard.schemas.trace",
    "flashcard.schemas.user",
    "flashcard.services.consumption",
    "flashcard.services.expression",
    "flashcard.services.review_state",
    "flashcard.services.trace_logger",
    "flashcard.services.user",
    "flashcard.settings",
    "flashcard.telegram.handlers.audio",
    "flashcard.telegram.handlers.collection",
    "flashcard.telegram.handlers.creation",
    "flashcard.telegram.handlers.errors",
    "flashcard.telegram.handlers.feedback",
    "flashcard.telegram.handlers.inline_remove",
    "flashcard.telegram.handlers.reply_commands",
    "flashcard.telegram.handlers.review",
    "flashcard.telegram.handlers.story",
    "flashcard.telegram.handlers.user_settings",
    "flashcard.telegram.handlers.verb",
    "flashcard.telegram.helpers.callback_utils",
    "flashcard.telegram.keyboards",
    "flashcard.telegram.middlewares.trace_middleware",
    "flashcard.utils.tracing",
]
ignore_errors = true
