services:
  flashcard-bot:
    build:
      context: ./flashcard-project
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - internal

  wr-scraper:
    build:
      context: ./WR_scraper
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      - TZ=Europe/Rome
    networks:
      - internal

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - internal
    depends_on:
      - flashcard-bot

  duckdns:
    image: linuxserver/duckdns
    restart: unless-stopped
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS}
      - TOKEN=${DUCKDNS_TOKEN} 
      - TZ=Europe/Rome

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
