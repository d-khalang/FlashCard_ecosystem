services:
  flashcard-bot:
    build:
      context: ./flashcard-project
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      - TELEGRAM_DELIVERY_MODE=${TELEGRAM_DELIVERY_MODE:-webhook}
      - LLM_KEY_FILE=/run/secrets/llm_key.json
    secrets:
      - source: llm_key
        target: llm_key.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 120s
      timeout: 15s
      retries: 5
    sysctls:
      - net.ipv4.tcp_keepalive_time=120
      - net.ipv4.tcp_keepalive_intvl=30
      - net.ipv4.tcp_keepalive_probes=3
    networks:
      - internal
    volumes:
      - ./flashcard-project/logs:/app/logs

  conjugator:
    build:
      context: ./it-conjugator-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      - TZ=Europe/Rome
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 120s
      timeout: 5s
      retries: 3
    networks:
      - internal

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--auth", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      # Bind to localhost only so it's only accessible via SSH port forwarding
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_flashcard_data:/data/db
    networks:
      - internal
    
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_INITDB_ROOT_USERNAME}", "-p", "${MONGO_INITDB_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 10s
      retries: 5

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "4"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      - DOMAIN=${DOMAIN}
      - WEBHOOK_PATH=${WEBHOOK_PATH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
    networks:
      - internal
    depends_on:
      - flashcard-bot

volumes:
  caddy_data:
  caddy_config:
  mongo_flashcard_data:

secrets:
  llm_key:
    file: ${LLM_KEY_FILE_HOST:-./flashcard-project/config/llm_key.json}

networks:
  internal:
    driver: bridge
