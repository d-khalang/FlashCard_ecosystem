services:
  flashcard-bot:
    build:
      context: ./flashcard-project
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      - TELEGRAM_DELIVERY_MODE=${TELEGRAM_DELIVERY_MODE:-webhook}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 120s
      timeout: 5s
      retries: 5
    networks:
      - internal

  wr-scraper:
    build:
      context: ./WR_scraper
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      - TZ=Europe/Rome
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 120s
      timeout: 5s
      retries: 3
    networks:
      - internal

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
    networks:
      - internal
    depends_on:
      - flashcard-bot

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
